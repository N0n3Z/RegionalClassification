url: https://n0n3z.github.io/regionalclassification/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#003A80"
    link-color: "#003A80"
    navbar-bg: "#003A80"
    code-color: "#C0392B"
    border-radius: "0.4rem"
    btn-border-radius: "0.3rem"
  includes:
    in_header: |
      <style>
        .navbar-brand { font-weight: 700; letter-spacing: .05em; }
        .pkgdown-nav-fixed .navbar { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        .template-home .contents { margin-top: 2rem; }
        code { background: #f4f7fb; border-radius: .25em; padding: .1em .3em; }
        .ref-description { font-size: 0.92rem; color: #555; }
      </style>

home:
  title: "nbbbenuts — Belgian Geographic Classifications"
  description: >
    Convert Belgian geographic codes between classification systems
    (NIS, NUTS, postal) and across time versions. Includes rebasing
    of longitudinal datasets, M:N weighted splitting, and coverage diagnostics.
  links:
    - text: GitHub repository
      href: https://github.com/n0n3z/regionalclassification
    - text: Report a bug
      href: https://github.com/n0n3z/regionalclassification/issues

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: "Get started"
      href: articles/introduction.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/n0n3z/regionalclassification
      aria-label: GitHub

articles:
  - title: "Guides"
    navbar: ~
    contents:
      - introduction
      - conversions
      - ambiguous-splits
      - diagnostics

reference:
  - title: "Données de référence"
    desc: >
      Charger le snapshot de données pré-construit ou le reconstruire à partir
      des fichiers bruts. Les datasets `rc_*` sont des exemples représentatifs.
    contents:
      - load_master_data
      - rebuild_master_data
      - rc_communes_2019
      - rc_communes_2025
      - rc_arrondissements_2019
      - rc_nuts3_2021
      - rc_postal

  - title: "Identifiants de classification"
    desc: >
      Référence complète des 22 identifiants canoniques et des outils pour
      explorer les routes de conversion disponibles.
    contents:
      - classification_reference
      - get_all_classification_nodes
      - get_conversion_matrix
      - list_available_conversions
      - check_conversion_path
      - print_conversion_check

  - title: "Conversion de codes"
    desc: >
      Fonctions principales pour convertir des codes géographiques entre
      classifications, unitairement ou sur un dataset entier.
    contents:
      - convert_codes
      - convert_dataset

  - title: "Lookup et validation"
    desc: >
      Vérifier la validité des codes, récupérer les noms officiels et
      construire des tables de correspondance.
    contents:
      - validate_codes
      - get_label
      - get_crosswalk

  - title: "Conversions ambiguës (M:N)"
    desc: >
      Outils pour les conversions où un code source correspond à plusieurs
      codes cibles (ex. arrondissement Verviers → BE335 + BE336).
      Permet une distribution proportionnelle par des poids enregistrés
      ou fournis à la volée.
    contents:
      - split_ambiguous
      - split_weights_template
      - register_split_weights
      - get_split_weights
      - list_split_weights
      - clear_split_weights

  - title: "Rebasement longitudinal"
    desc: >
      Convertir des séries temporelles qui couvrent plusieurs versions de
      classification. Gère les fusions N:1 (agrégation) et les splits
      1:N (distribution pondérée).
    contents:
      - rebase_series

  - title: "Diagnostic et détection"
    desc: >
      Vérifier la couverture d'un dataset par rapport à une classification,
      détecter automatiquement la classification la plus probable, et
      retrouver des codes via correspondance floue de noms.
    contents:
      - diagnose_classification
      - detect_classification
      - fuzzy_match_names
      - identify_from_names

  - title: "Visualisation"
    desc: >
      Explorer graphiquement les relations entre classifications et la
      hiérarchie NIS (requiert `visNetwork`).
    contents:
      - visualize_classification_graph
      - visualize_conversion_matrix
      - visualize_hierarchy

news:
  releases:
    - text: "Version 0.1.0"
      href: news/index.html

authors:
  N0n3Z:
    href: https://github.com/n0n3z
